# DCM:206 certified liquid-box → JAX-MD NVT → JAX-MD NVE (handoff).
#
# Prerequisites (run from the campaign directory, e.g. mmml_tutorial/acodcm):
#   boxes/dcm206/{model.psf,model.crd,box.json}   # liquid-box PASS
#   checkpoint path below points at your hybrid ckpt
#
# Run:
#   mmml md-system --config md_system.dcm206_certified_nvt_nve.yaml --run-all
#
# Or copy this file into the campaign dir and edit checkpoint / paths.
#
# Expected log markers on the NVT leg:
#   Loading certified geometry from model.psf + model.crd ...
#   Certified box: L=28.167 Å ... from .../box.json
#   PBC cell: L=28.167 Å (source=yaml)
# NVE leg should skip ASE/CHARMM pre-min (handoff) and keep velocities.

include:
  - presets/base-dt0.5.yaml
  - presets/certified-box-handoff.yaml

defaults:
  composition: "DCM:206"
  # Edit to your hybrid checkpoint (directory or params JSON):
  checkpoint: ckpts/hybrid/hybrid-96e58a2d-3798-4463-a318-fca1b7001dc3
  seed: 22
  temperature: 250.0
  pressure: 1.0
  dt_fs: 0.5

  # Certified liquid-box (sibling box.json sets L; do not set box_auto density here)
  from_psf: boxes/dcm206/model.psf
  from_crd: boxes/dcm206/model.crd
  # Optional explicit L; box.json overrides if it differs:
  # box_size: 28.167

  mm_switch_on: 8.0
  mm_switch_width: 5.0
  ml_switch_width: 1.5
  include_mm: true

  # Dense-liquid contact floor (same scale as prep)
  min_intermonomer_atom_distance: 0.45
  dynamics_overlap_min_distance: 0.45
  dynamics_overlap_action: warn

  # Neighbor list (match prior GPU runs)
  jax_md_update_interval: 1
  jax_md_skin_distance: 0.5
  steps_per_recording: 500

  # Keep cutoffs identical across NVT → NVE handoff
  continue_velocities: true
  handoff_write_res: true
  handoff_require_cell: true
  mc_density_equalize: false

campaign_output: artifacts/dcm206_certified_nvt_nve

runs:
  jaxmd_nvt:
    description: "Load certified box; JAX-MD NVT thermalization"
    backend: jaxmd
    setup: pbc_nvt
    ps: 10.0
    output_dir: runs/dcm206_jaxmd_nvt
    calculator_pre_minimize: true
    pre_min_ase_order: fire-first
    bfgs_polish_max_fmax: 1.0
    pre_min_fmax: 0.1
    pre_min_steps: 50
    jaxmd_minimize_steps: 500
    jaxmd_pbc_minimize_steps: 500
    continue_velocities: false

  jaxmd_nve:
    description: "JAX-MD NVE from NVT handoff"
    backend: jaxmd
    setup: pbc_nve
    depends_on: jaxmd_nvt
    ps: 10.0
    output_dir: runs/dcm206_jaxmd_nve
    continue_velocities: true
    handoff_quality_gate: true
    handoff_quality_fmax_eVA: 1.0
    handoff_quality_action: minimize
    handoff_pre_minimize: false
    calculator_pre_minimize: false
    jaxmd_minimize_steps: 500
    jaxmd_pbc_minimize_steps: 500
