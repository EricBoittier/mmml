# Snakemake >=8.6: requires snakemake-executor-plugin-slurm.
# Run with: uv run --with snakemake --with snakemake-executor-plugin-slurm \
#   snakemake --profile profiles/slurm --keep-going
# pc-studix: submit from the login node via this profile (PyCHARMM on the
# login node itself fails with `libOpenCL.so.1: cannot open shared object
# file` — do not run scripts/run_setting.py directly there).
executor: slurm
jobs: 15
latency-wait: 120
retries: 0
default-resources:
  - gpu=1
  - charmm_slot=1
  - runtime=30
  - nodes=1
  - tasks=1
  - mem_mb_per_cpu=2000
  - cpus_per_task=4
  - slurm_partition=gpu
