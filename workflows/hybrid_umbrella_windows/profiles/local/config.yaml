# Local / interactive GPU node (or dry-run with -n).
jobs: 2
latency-wait: 60
keep-going: true
printshellcmds: true
envvars:
  - KARML_CKPT
  - KARML_WORKFLOW_CONFIG
  - CHARMM_LIB_DIR
  - JAX_ENABLE_X64
  - JAX_PLATFORMS
  - CUDA_VISIBLE_DEVICES
  - KARML_EXAMPLE_DEVICE
default-resources:
  - gpu_slot=1
  - charmm_slot=1
  - mem_mb=16000
  - cpus_per_task=4
