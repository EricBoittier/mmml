# Snakemake >=8.6 + snakemake-executor-plugin-slurm (studix GPU).
# Submit from the login node — do not run JAX/PyCHARMM jobs on the login node.
executor: slurm
jobs: 8
latency-wait: 120
# CUDA_ERROR_UNKNOWN is intermittent on busy GPU nodes; retry a few times.
retries: 3
keep-going: true
envvars:
  - MMML_CKPT
  - MMML_WORKFLOW_CONFIG
  - MMML_CGENFF_EXTRA_RTF
  - MMML_CGENFF_EXTRA_PRM
  - CHARMM_LIB_DIR
  - JAX_ENABLE_X64
  - JAX_PLATFORMS
default-resources:
  # Throttle only. A resource named `gpu` would be turned into --gpus=N by the
  # executor plugin and clash with the per-rule `gres` request.
  - gpu_slot=1
  - charmm_slot=1
  - runtime=720
  - nodes=1
  - tasks=1
  - mem_mb_per_cpu=8000
  - cpus_per_task=4
  - slurm_partition=gpu
