# Prep-parameter sweep stage 2: vdw_off anchor × mini+heat × dt / overlap / CHARMM freq.
#
# Run:
#   cd workflows/dcm_density_setup_compare
#   MMML_WORKFLOW_CONFIG=config.prep_sweep.yaml bash scripts/preflight.sh
#   nohup bash scripts/snakemake_prep_sweep.sh > snakemake_prep_sweep.log 2>&1 &
#   bash scripts/collect_prep_sweep.sh
#
# Tags: {setup}_dcm_{N}_t{T}_l{L}_ht_{thermostat}_sw_{variant}
# Example: resilient_dcm_52_t50_l28_ht_bussi_sw_dt010

setups: [resilient]
solvents: [DCM]

bulk_density_fractions: [0.25]
temperatures: [50.0]
box_sizes: [28.0]

checkpoint: ${MMML_CKPT}
output_root: artifacts/dcm_density_setup_compare
seed_base: 4242

# Stage-1 winners: spacing50 (GRMS≈22) + mm_vdw_off (GRMS≈27).
spacing: 5.0
periodic_charmm_vdw: false
packmol_tolerance: 2.0
packmol_box_padding: 1.0

dt_fs: 0.25
pressure: 1.0

no_scale_max_grms: true
max_grms_before_dyn: 50.0
allow_high_grms: true

mini_nstep: 2000
charmm_sd_steps: 4000
charmm_abnr_steps: 4000
pre_min_steps: 500

# Baseline overlap check every 100 heat/dynamics steps; variants tighten below.
dynamics_overlap_check_interval: 100
dynamics_overlap_charmm_sd_steps: 400
dynamics_overlap_charmm_abnr_steps: 800
dynamics_overlap_min_distance: 1.5
min_intermonomer_atom_distance: 1.2

# Trajectory / neighbor-list cadence (resilient cleanup default dcd_nsavc=100).
dcd_nsavc: 100
dyn_inbfrq: -1

liquid_prep: true
density_prep_ladder: true
density_prep_ladder_max_rounds: 8
density_prep_lattice_abnr_steps: 300
mini_lattice_abnr_steps: 300
mc_density_equalize: true
mc_density_steps: 128
mini_box_equil_ps: 5.0
calculator_pre_minimize: true
bonded_mm_mini: false
# Isolated CHARMM subprocess for bonded recovery (no MLpot param toggle).
bonded_recovery_backend: sidecar

mm_switch_on: 5.0
mm_switch_width: 3.0
ml_switch_width: 0.2
mm_nonbond_mode: jax_mic
charmm_mm_pretreat: true

# Heat leg (single thermostat on anchor; no equi/prod/jaxmd/ase).
default_heat_thermostat: bussi
ps_heat: 5.0
n_heat_segments: 3
heat_firstt: 10.0
no_echeck_heat: true
heat_thermostats: []
dynamics_legs:
  pycharmm_equi: false
  pycharmm_prod: false
  jaxmd: false
  ase: false

ml_gpu_count: 1
ml_batch_size: 128

slurm_small_cluster_max_n: 30
slurm_max_concurrent_fast: 6
slurm_max_concurrent_slow: 4
slurm_partition: gpu
slurm_nodes: 1
slurm_ntasks: 1
slurm_cpus_per_task: 4
slurm_mem_mb_per_cpu: 3000
slurm_runtime_min: 1440
slurm_gpu_nodes_fast:
  - gpu08
  - gpu09
  - gpu10
  - gpu11
  - gpu06
  - gpu26
  - gpu04
  - gpu25
slurm_gpu_nodes_slow:
  - gpu01
  - gpu02
  - gpu03
  - gpu12
  - gpu13
  - gpu18
  - gpu20
  - gpu21
  - gpu22
  - gpu23

prep_sweep:
  enabled: true
  stages: mini,heat
  full_dynamics: false
  # Keep Packmol / liquid_prep seed identical to mini-only sweep (do not offset by heat thermostat).
  placement_seed_ignore_heat: true
  anchor:
    setup_id: resilient
    solvent: DCM
    bulk_density_fraction: 0.25
    temperature: 50.0
    box_size: 28.0
    heat_thermostat: bussi
  variants:
    # vdw_off + spacing50 anchor (no extra overrides).
    baseline: {}
    # Smaller integration timestep (fs).
    dt050:
      dt_fs: 0.05
    dt010:
      dt_fs: 0.10
    dt015:
      dt_fs: 0.15
    # More frequent overlap rescue checks during heat (steps between checks).
    ovlp50:
      dynamics_overlap_check_interval: 50
    ovlp25:
      dynamics_overlap_check_interval: 25
    # More frequent DCD frames (lower nsavc = higher recording frequency).
    dcd50:
      dcd_nsavc: 50
    dcd25:
      dcd_nsavc: 25
    # More frequent CHARMM neighbor-list rebuild during heat/dynamics.
    inbfrq25:
      dyn_inbfrq: 25
    inbfrq10:
      dyn_inbfrq: 10
    # Combo: smallest dt + tightest overlap polling from stage-1 spacing50 follow-up.
    dt050_ovlp50:
      dt_fs: 0.05
      dynamics_overlap_check_interval: 50
