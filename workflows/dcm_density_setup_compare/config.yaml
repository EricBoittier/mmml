# DCM density × setup comparison (box prep + heat thermostat + dynamics backends).
#
# Matrix: setups × bulk_density_fractions × box_sizes × temperatures
#         × heat_thermostats (when set)
# Campaign per cell: pycharmm_mini (mini+heat) until dynamics_legs are re-enabled
# Output: artifacts/dcm_density_setup_compare/{setup}_dcm_{n}_t{T}_l{L}[_ht_{thermostat}]/

setups:
  - resilient
  # Full comparison matrix (uncomment when comparing prep stacks):
  # - minimal
  # - calculator_pre_sd
  # - liquid_prep_dense
  # - burst_hybrid

solvents: [DCM]

# Anchor-only while validating prep (Pre-dynamics GRMS OK on 52_t50_l28).
# Full matrix (uncomment after anchor passes):
# bulk_density_fractions: [0.25, 0.5]
# temperatures: [50.0, 75.0, 100.0]
# temperature_ladder: true
# box_sizes: [28.0, 30.0, 32.0]
bulk_density_fractions: [0.25]
temperatures: [50.0]
temperature_ladder: false
box_sizes: [28.0]

checkpoint: ${MMML_CKPT}
output_root: artifacts/dcm_density_setup_compare
seed_base: 4242

# Same Packmol seed as prep_sweep anchor (do not offset by heat_thermostat name).
placement_seed_ignore_heat: true

dt_fs: 0.25
pressure: 1.0
# Prep sweep winners: spacing50 + mm_vdw_off + jax_mic nonbond + CHARMM pretreat.
spacing: 5.0
periodic_charmm_vdw: false
packmol_tolerance: 5.0
packmol_box_padding: 2.0
mm_nonbond_mode: jax_mic
charmm_mm_pretreat: true

# Stricter pre-dynamics GRMS gate (do not scale up with bad per-monomer stats).
# no_scale_max_grms: true
max_grms_before_dyn: 200.0
# Smoke/debug: proceed when mini GRMS > max_before_dyn (overlap rescue may still fail).
allow_high_grms: true

# More mini / rescue capacity before heat (override resilient cleanup defaults).
mini_nstep: 2000
charmm_sd_steps: 4000
charmm_abnr_steps: 4000
pre_min_steps: 500

# Overlap checks during heat/dynamics: smaller interval = more frequent (steps).
# Prep sweep stage 2: 50 beat 100 on anchor mini+heat (avoid dt=0.05 for heat).
dynamics_overlap_check_interval: 50
dynamics_overlap_charmm_sd_steps: 400
dynamics_overlap_charmm_abnr_steps: 800
dynamics_overlap_min_distance: 1.5
min_intermonomer_atom_distance: 1.2

# Heat DCD cadence (lower nsavc = more frequent frames; dcd25 winner on anchor).
dcd_nsavc: 25
# Prep sweep winner: defer CHARMM inbfrq rebuild until dynamics (SD uses inbfrq=0 chunks).
dyn_inbfrq: -1

# Resilient density prep (merged into resilient setup; reinforces variant defaults).
liquid_prep: true
density_prep_ladder: true
density_prep_ladder_max_rounds: 8
density_prep_lattice_abnr_steps: 300
mini_lattice_abnr_steps: 300
mc_density_equalize: true
# Extra MC capacity (mc_density dropped anchor GRMS 261→129 in latest run).
mc_density_steps: 256
mini_box_equil_ps: 5.0
calculator_pre_minimize: true
# FIRE-first when GRMS > crossover (BFGS spikes on severe overlap at ~140 kcal/mol/Å).
geometry_packing_fire_bfgs_crossover_grms: 200.0
# MLpot SD recovery inside geometry packing (default 200; resilient cleanup uses 500+).
bonded_mm_mini_steps: 1000

# Mini-only smoke: skip post-mini bonded-MM strain path (fragile on dense PBC all-ML).
bonded_mm_mini: false

# Heat (prep sweep: bussi + short smoke heat until anchor stable; expand thermostats later).
heat_thermostats: [bussi]
ps_heat: 2.0
n_heat_segments: 1
heat_firstt: 10.0
no_echeck_heat: true

# Re-enable after anchor passes mini+heat (Pre-dynamics GRMS OK, heat completes).
dynamics_legs:
  pycharmm_equi: false
  pycharmm_prod: false
  jaxmd: false
  ase: false
default_heat_thermostat: bussi
handoff_write_res: true
continue_velocities: true
pycharmm_equi_ps: 10.0
pycharmm_equi_legs: 1
pycharmm_prod_ps: 10.0
pycharmm_prod_legs: 1
prod_ensemble: pbc_npt
jaxmd_setup: pbc_nvt
jaxmd_ps: 10.0
ase_setup: pbc_nvt
ase_integrator: nvt_nhc
ase_ps: 10.0
# optional_legs: [jaxmd_prod, ase_prod]

mm_switch_on: 5.0
mm_switch_width: 3.0
ml_switch_width: 0.2
ml_gpu_count: 1
ml_batch_size: 128

slurm_small_cluster_max_n: 30
slurm_max_concurrent_fast: 16
slurm_max_concurrent_slow: 12
slurm_partition: gpu
slurm_nodes: 1
slurm_ntasks: 1
slurm_cpus_per_task: 4
slurm_mem_mb_per_cpu: 3000
slurm_runtime_min: 1440
slurm_gpu_nodes_fast:
  - gpu08   # RTX5090 ×2
  - gpu09
  - gpu10
  - gpu11
  - gpu06   # RTX4090 ×1
  - gpu26
  - gpu04   # RTX3090 ×2
  - gpu25   # RTX3090 Ti ×2
slurm_gpu_nodes_slow:
  - gpu01   # RTX3080 ×2, smoke / N≤30
  - gpu02
  - gpu03
  - gpu12
  - gpu13
  - gpu18
  - gpu20
  - gpu21
  - gpu22
  - gpu23

# exclude_run_tags:
#   - resilient_dcm_77_t100_l32

# Prep-parameter sweep (anchor cell × variants): see config.prep_sweep.yaml and README.
