# DCM density × setup comparison (box prep + optional heat thermostat sweep).
#
# Matrix: setups × bulk_density_fractions × box_sizes × temperatures
#         × heat_thermostats (when set)
# Output: artifacts/dcm_density_setup_compare/{setup}_dcm_{n}_t{T}_l{L}[_ht_{thermostat}]/

setups:
  - resilient
  # Full comparison matrix (uncomment when comparing prep stacks):
  # - minimal
  # - calculator_pre_sd
  # - liquid_prep_dense
  # - burst_hybrid

solvents: [DCM]

bulk_density_fractions: [0.25, 0.5, 0.75, 1.0]
# bulk_density_fractions: [0.25, 0.5]
bulk_density_n_min: 10
temperatures: [50.0, 75.0, 100.0]
box_sizes: [28.0, 30.0, 32.0]

checkpoint: ${MMML_CKPT}
output_root: artifacts/dcm_density_setup_compare
seed_base: 4242

dt_fs: 0.25
pressure: 1.0
# Easier Packmol convergence (see md_system.dense_liquid_prep.example.yaml).
spacing: 4.5
packmol_tolerance: 1.5
# Keep Packmol cube near L_sim (N is bulk-sized for the full cell, not an inset cube).
packmol_box_padding: 1.0

# Resilient density prep (merged into resilient setup; reinforces variant defaults).
liquid_prep: true
density_prep_ladder: true
density_prep_ladder_max_rounds: 5
density_prep_lattice_abnr_steps: 300
mini_lattice_abnr_steps: 300
mc_density_equalize: true
mc_density_steps: 128
min_intermonomer_atom_distance: 1.0
max_grms_before_dyn: 50.0
mini_box_equil_ps: 5.0
calculator_pre_minimize: true

# Mini-only smoke: skip post-mini bonded-MM strain path (fragile on dense PBC all-ML).
bonded_mm_mini: false

# Heat thermostat comparison (omit or [] for mini-only box prep).
heat_thermostats: [bussi, hoover, scale]
ps_heat: 5.0
n_heat_segments: 3
heat_firstt: 10.0
no_echeck_heat: true

mm_switch_on: 5.0
mm_switch_width: 3.0
ml_switch_width: 0.2
ml_gpu_count: 1
ml_batch_size: 128

slurm_small_cluster_max_n: 30
slurm_max_concurrent_fast: 10
slurm_max_concurrent_slow: 8
slurm_partition: gpu
slurm_nodes: 1
slurm_ntasks: 1
slurm_cpus_per_task: 4
slurm_mem_mb_per_cpu: 3000
slurm_runtime_min: 1440
slurm_gpu_nodes_fast:
  - gpu08   # RTX5090 ×2
  - gpu09
  - gpu10
  - gpu11
  - gpu06   # RTX4090 ×1
  - gpu26
  - gpu04   # RTX3090 ×2
  - gpu25   # RTX3090 Ti ×2
slurm_gpu_nodes_slow:
  - gpu01   # RTX3080 ×2, smoke / N≤30
  - gpu02
  - gpu03
  - gpu12
  - gpu13
  - gpu18
  - gpu20
  - gpu21
  - gpu22
  - gpu23

# exclude_run_tags:
#   - resilient_dcm_77_t100_l32
