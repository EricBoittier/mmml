# One-cell Slurm smoke test for the PBC ML/MM pipeline.
# Kept separate from config.yaml so production matrix settings remain untouched.
solvents: [DCM]
cluster_sizes: [10]
temperatures: [150.0]
box_sizes: [32.0]
checkpoint: examples/sppoky-epoch-0010_params.json
output_root: artifacts/pbc_solvent_burst_spooky_smoke
seed_base: 123

# Exercise every handoff, but keep the test short enough for a 30-minute slot.
jaxmd_burst_ps: 0.2
jaxmd_bursts: 1
pycharmm_equi_ps: 0.1
pycharmm_equi_legs: 1
ps_heat: 0.1
n_heat_segments: 1
heat_firstt: 20.0
heat_thermostat: hoover
dt_fs: 0.1
pressure: 1.0

cleanup_strategy:
  name: pbc_hybrid_smoke
  charmm_mm:
    pretreat_on_pycharmm: true
    ps_heat: 0.05
    ps_equi: 0.05
    ps_prod: 0.05
    overlap_rescue_sd_steps: 100
    overlap_rescue_abnr_steps: 200
  mlpot:
    no_echeck_heat: true
    dynamics_overlap_action: rescue
    dynamics_overlap_min_distance: 1.5
    dynamics_intra_min_distance: 0.5
    dynamics_overlap_check_interval: 100
    dynamics_overlap_memory_handoff: true
    bonded_mm_mini: true
    bonded_mm_mini_after: mini,heat,equi
    bonded_mm_mini_steps: 200
    charmm_pre_minimize: true
    charmm_sd_steps: 200
    charmm_abnr_steps: 200
    mini_nstep: 100
    dcd_nsavc: 50
    dyn_nprint: 50
    save_run_state: true
  jaxmd_pbc:
    handoff_quality_gate: true
    handoff_quality_fmax_eVA: 10.0
    handoff_quality_action: minimize
    jaxmd_minimize_steps: 50
    jaxmd_pbc_minimize_steps: 50
    dynamics_overlap_action: rescue
    overlap_rescue_sd_steps: 100
    overlap_rescue_abnr_steps: 200
    steps_per_recording: 50
    jax_md_update_interval: 1

mm_switch_on: 6.0
mm_switch_width: 4.0
ml_switch_width: 1.0
spacing: 4.0
packmol_tolerance: 1.0
ml_gpu_count: 1
ml_batch_size: 512
mpirun_wrapper: ../../scripts/mmml-charmm-mpirun.sh
