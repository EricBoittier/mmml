# Smoke matrix: one small box, short MD, two JSONs × both backends × T ladder.
# Standalone (no YAML include) so the checkpoint map fully replaces the default.

solvents: [METH]
temperatures: [100.0, 200.0, 300.0]
box_sizes: [16.0]
bulk_density_fractions: [0.5]
bulk_density_n_min: 8
backends: [pycharmm, jaxmd]

checkpoints:
  des: examples/ckpts_json/DESdimers_params.json
  sppoky10: examples/sppoky-epoch-0010_params.json

output_root: artifacts/pbc_methane_ewald_smoke
seed_base: 4242

mm_nonbond_mode: periodic_external
lr_solver: ewald
ensemble: pbc_nvt

ps_heat: 1.0
n_heat_segments: 2
heat_firstt: 50.0
heat_thermostat: scale
pycharmm_equi_ps: 1.0
pycharmm_equi_legs: 1
pycharmm_prod_ps: 1.0
pycharmm_prod_legs: 1
jaxmd_equi_ps: 1.0
jaxmd_prod_ps: 1.0

dt_fs: 0.25
pressure: 1.0
spacing: 4.0
packmol_tolerance: 1.5

liquid_prep: true
density_prep_ladder: true
density_prep_ladder_max_rounds: 3
mc_density_equalize: true
mc_density_steps: 40
min_intermonomer_atom_distance: 1.0
max_grms_before_dyn: 50.0

cleanup_strategy:
  name: pbc_methane_ewald_smoke
  charmm_mm:
    pretreat_on_pycharmm: true
    ps_heat: 0.5
    ps_equi: 0.5
    ps_prod: 0.25
    overlap_rescue_sd_steps: 100
    overlap_rescue_abnr_steps: 200
  mlpot:
    cleanup: true
    no_echeck_heat: true
    dynamics_overlap_action: rescue
    dynamics_overlap_min_distance: 1.5
    dynamics_intra_min_distance: 0.5
    dynamics_overlap_check_interval: 250
    bonded_mm_mini: true
    bonded_mm_mini_after: mini,heat
    bonded_mm_mini_steps: 200
    charmm_pre_minimize: true
    charmm_sd_steps: 200
    charmm_abnr_steps: 200
    mini_nstep: 100
    dcd_nsavc: 50
    dyn_nprint: 50
    save_run_state: true
  jaxmd_pbc:
    handoff_quality_gate: true
    handoff_quality_fmax_eVA: 20.0
    handoff_quality_action: minimize
    jaxmd_minimize_steps: 50
    steps_per_recording: 200

mm_switch_on: 8.0
mm_switch_width: 5.0
ml_switch_width: 1.5
ml_gpu_count: 1
ml_batch_size: 128
ml_compute_dtype: float64

warmup_mlpot_jax: true
mpirun_wrapper: ../../scripts/mmml-charmm-mpirun.sh
MMML_MPI_NP: 1

slurm_partition: gpu
slurm_nodes: 1
slurm_ntasks: 1
slurm_cpus_per_task: 4
slurm_mem_mb_per_cpu: 4000
slurm_runtime_min: 180
slurm_max_concurrent: 6
slurm_gpu_nodes_fast:
  - gpu08
  - gpu09
