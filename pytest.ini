[pytest]
# Pytest configuration for MMML

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    
# Test paths
testpaths = tests

# Put the repo root on sys.path for every invocation.
# `tests/unit/` has no __init__.py, so under the default `prepend` import mode
# pytest inserts `tests/unit` as the basedir rather than the repo root. Tests
# that do `import scripts.<module>` (a namespace package, no __init__.py) then
# fail to collect whenever a subset is selected -- `pytest tests/unit/` errored
# while `pytest tests/` worked, which made it look like a real regression.
pythonpath = .

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    cli: marks tests as CLI tests
    unit: marks tests as unit tests
    charmm_mpi: CHARMM MPI bootstrap, rank-0 I/O, and Tier 2/3 validation tests
    pycharmm: requires live PyCHARMM (CHARMM_HOME, libcharmm); run on GPU node via scripts/run_pycharmm_pytest_gpu.sh
    gpu: loads ML checkpoints or prefers JAX GPU; pair with -m pycharmm on GPU nodes
    mlpot: MLpot / PyCHARMM ML integration tests
    charmm_serial: live PyCHARMM tests that must not run under mpirun (second PSF/CGENFF read)
    
# Coverage options (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = --cov=mmml --cov-report=html --cov-report=term
