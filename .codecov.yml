# Codecov configuration.
#
# The previous settings could not report a regression: `patch: false` waived
# coverage on new code entirely, and a 50-percentage-point project threshold
# meant total coverage could halve while the status stayed green. A check that
# cannot go red is a false positive, so both are tightened here.
coverage:
  # CI-reachable ceiling is ~70% (live CHARMM / plotting / GPU). 48% is above
  # the 42% floor; the default 70…100 scale painted that as failure-red.
  range: 40...70
  precision: 2
  round: down
  status:
    # New/changed lines. Informational for now -- it annotates the PR with the
    # patch number but does not block, so the signal appears before the gate
    # does. Flip `informational` to false once patch coverage is routinely met.
    patch:
      default:
        target: 60%
        informational: true
    # Total coverage. 1 percentage point of slack absorbs run-to-run jitter
    # (skipped optional-dependency tests shifting a few lines) without waving
    # through a real drop.
    project:
      default:
        threshold: 1%
comment:
  layout: "header, diff, files"
  require_changes: false
  branches: null
  behavior: default
  flags: null
  paths: null
