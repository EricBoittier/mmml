# N-methylacetamide (NMA) methyl rotations — CGenFF atom order from `mmml make-res --res NMA`
#
# 0-based ASE indices (match PSF order):
#   0 CL, 1-3 HL1-3, 4 C, 5 O, 6 N, 7 H, 8 CR, 9-11 HR1-3
#
# Omit mask → covalent-topology fragment on the a3 side of a2–a3.
# See docs/ic-scan-design.md for mask rules (a4 must be included).
#
#   mmml ic-scan --config examples/ic_scan/nma_methyl.yaml \
#     --output artifacts/nma_methyl_xtb --overwrite

structure: nma.xyz
calculator: xtb
evaluate: energy
geometry_mode: rigid
failure_policy: fail

dofs:
  - name: acetyl_methyl
    kind: dihedral
    atoms: [6, 4, 0, 1]      # N-C-CL-HL1
    start: -180
    stop: 180
    n_points: 37
  - name: n_methyl
    kind: dihedral
    atoms: [4, 6, 8, 9]      # C-N-CR-HR1
    start: -180
    stop: 180
    n_points: 37

scans:
  - name: acetyl_1d
    dofs: [acetyl_methyl]
  - name: n_methyl_1d
    dofs: [n_methyl]
