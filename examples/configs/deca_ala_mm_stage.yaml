# deca_ala_mm_stage.yaml
# Gas-phase deca-alanine (10-mer) simulation with dynamic NVT temperature schedule.
sequence: "ALA ALA ALA ALA ALA ALA ALA ALA ALA ALA"
n_waters: 0
box_size: 100.0
seed: 42
temperature: 298.0
dt_fs: 0.5

use_ml_intramolecular: false

fire_steps: 500
fire_block_steps: 100
nvt_total_steps: 4000
nvt_block_steps: 500
nve_total_steps: 1000
nve_block_steps: 500
fire_cycles: 2

peptide_bond_k_ev: 0.0
max_bond_dev_limit: 99.0
write_dcd: true
output_dir: "./output_deca_stage"

# Ramp from 298K to 398K over the first 50% steps, and cool down to 298K over the last 50% steps
nvt_temp_schedule: "298.0->398.0:0.5, 398.0->298.0:0.5"
