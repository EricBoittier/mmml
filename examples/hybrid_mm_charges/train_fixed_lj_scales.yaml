# Mode A + learnable per-type LJ σ/ε scales on CGenFF master tables
#   σ_eff[t] = master_σ[t] * s_σ[t]
#   ε_eff[t] = master_ε[t] * s_ε[t]
#
#   mmml physnet-train --config examples/hybrid_mm_charges/train_fixed_lj_scales.yaml
#
# MIC only (ewald / nvalchemiops_pme force LJ off). Scales land in
# hybrid_mm.json next to the run for MD --mm-lj-scales-file / auto-load.

data: /path/to/out_combined_dedup/energies_forces_dipoles_train.npz
valid_data: /path/to/out_combined_dedup/energies_forces_dipoles_valid.npz
ckpt_dir: ./ckpts/hybrid_mm_fixed_lj_scales
tag: hybrid_mm_fixed_lj_scales

hybrid_mm: true
mm_charge_mode: fixed
learn_mm_lj_scales: true
mm_include_lj: true
lr_solver: mic

ml_switch_width: 1.5
mm_switch_on: 8.0
mm_switch_width: 5.0

charges: true
batch_size: 16
num_epochs: 500
learning_rate: 0.001
seed: 42

energy_weight: 1.0
forces_weight: 52.91
dipole_weight: 27.21
charges_weight: 14.39
objective: valid_loss
best: true
features: 64
max_degree: 0
num_iterations: 3
num_basis_functions: 32
cutoff: 10.0
