# Mode B + native Ewald on a small system (DCM:2, dimer-only)
#   Monomer ML + MM(Ewald) with q_MM = neutralize_per_monomer(q_ML)
#
# Companion to the analytic smoke
#   examples/hybrid_mm_charges/monomer_ml_mm_ewald_example.py
# and the capability-matrix entry in docs/calculator-capabilities.md
# ("Monomer ML + MM + native Ewald").
#
# Mode B needs exactly two monomers and a charges=True checkpoint trained
# with mm_charge_mode: latent. CHARMM bonded terms stay on via the PSF;
# USER owns ML monomers + MM Ewald Coulomb. --no-periodic-charmm-vdw keeps
# LJ off (Coulomb-only E_MM, same as the analytic example).
#
#   mmml md-system --config examples/hybrid_mm_charges/md_latent_ewald_dimer.yaml --run-all
#
# Do not use n_monomers != 2 or lr_solver: jax_pme with Mode B.

defaults:
  composition: "DCM:2"
  checkpoint: /path/to/ckpts/hybrid_mm_latent/<run>/params.json
  box_size: 20.0
  dt_fs: 0.5
  temperature: 300.0
  seed: 42
  include_mm: true
  mm_charge_mode: latent
  ml_switch_width: 1.5
  mm_switch_on: 8.0
  mm_switch_width: 5.0

  mm_nonbond_mode: periodic_external
  lr_solver: ewald
  periodic_charmm_vdw: false

campaign_output: results/hybrid_mm_latent_ewald_dimer
runs:
  dimer_nvt_smoke:
    description: >
      Small PBC NVT — Mode B latent charges + native Ewald Coulomb;
      CHARMM bonded retained (dimer-only)
    backend: pycharmm
    setup: pbc_nvt
    ps: 0.05
    output_dir: results/hybrid_mm_latent_ewald_dimer/dimer_nvt_smoke
    extra_args:
      - --skip-jit-warmup
      - --quiet
