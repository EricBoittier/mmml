# DESdimers architecture transferred to a user-selected larger cutoff.
# The launch command must set both `cutoff` and `shared_cutoff` identically and
# use --no-match-checkpoint-architecture so the 6 A checkpoint config does not
# silently overwrite the requested radius.
hybrid_mm: true
hybrid_hamiltonian: shared_cutoff
shared_cutoff: 8.0
mm_charge_mode: fixed
learn_mm_lj_scales: false
mm_include_lj: true
lr_solver: mic

charges: false
batch_size: 32
num_epochs: 25
learning_rate: 0.001
seed: 42
energy_weight: 1.0
forces_weight: 52.91
dipole_weight: 0.0
charges_weight: 0.0
objective: valid_loss
best: true

# Exact parameter-shape architecture of DESdimers_params.json. Only the radial
# cutoff is changed by the launch command; this is transfer, not a native
# longer-cutoff pretraining checkpoint.
features: 32
max_degree: 1
num_iterations: 2
num_basis_functions: 16
n_res: 3
max_atomic_number: 118
zbl: true
trainable_zbl: false
use_energy_bias: false
cutoff: 8.0

