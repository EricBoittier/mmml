# DCM liquid campaign (Packmol / seeded mini, jax_mic throughout) — jaxmd ladder.
#
# Ordering: settle → NVT (10 ps) → NpT (2 ps) → short NVE.
# PyCHARMM heat is intentionally omitted here: ASE Bussi @ 0.5 fs blew a DCM
# monomer after settle (extent guard); all-ML PBC cannot Packmol-repack.
# Learned LJ requires jax_mic (truncated MIC), not Ewald — issue #139.
#
# Throughput knobs (ensemble-aware):
#   Defaults bake in measured DCM:120 wins on jaxmd:
#     - dt_fs=1.0 (jaxmd-stable here; CHARMM heat fly-offs were separate)
#     - ml_compute_dtype=float32 (~2× vs f64)
#     - jax_md_skin_distance=0.5 + NVT jax_md_update_interval=40
#     - mm_nl_device=gpu (CUDA_PATH repair + CPU fallback if CuPy JIT fails)
#   NpT/NVE keep tighter NL (cell / E_tot). Recording ~1 ps/frame on NVT.

#
#   uv run mmml md-system \
#     --config examples/hybrid_mm_charges/md_fixed_lj_scales_liquid_campaign.yaml \
#     --run-all \
#     --checkpoint CKPT --mm-lj-scales-file SIDECAR \
#     --campaign-output-dir OUT
#
# Then: bash examples/lj_scales/12_analyze_liquid.sh

defaults:
  composition: "DCM:120"
  box_size: 30.0
  packmol_radius: 6.9
  # Packmol tolerance is the min distance between atoms of different molecules.
  # 2.0 packs Cl···H inside vdW; 3.0 is comfortable at this density.
  packmol_tolerance: 3.0
  checkpoint: /path/to/ckpts/hybrid_mm_fixed_lj_scales/<run>/params.json
  # mm_lj_scales_file: /path/to/ckpts/hybrid_mm_fixed_lj_scales/<run>/hybrid_mm.json
  temperature: 300.0
  pressure: 1.0
  # 1.0 fs is stable on jaxmd for this DCM liquid; CHARMM heat fly-off was separate.
  dt_fs: 1.0
  seed: 42
  include_mm: true
  mm_charge_mode: fixed
  mm_nonbond_mode: jax_mic
  ml_switch_width: 1.5
  mm_switch_on: 8.0
  mm_switch_width: 5.0
  skip_jit_warmup: true
  quiet: true
  continue_velocities: true
  handoff_write_res: true
  mc_density_equalize: false
  handoff_quality_gate: true
  handoff_quality_fmax_eVA: 3.0
  max_fmax_before_dyn_ev_A: 3.5
  ml_compute_dtype: float32
  mm_nl_device: gpu
  jax_md_skin_distance: 0.5
  # Ensemble auto is NVT=10 / NpT=5 / NVE=5; jobs below override for liquid MD.
  jax_md_update_interval: 0

campaign_output: results/hybrid_mm_fixed_lj_scales_liquid

runs:
  jaxmd_settle:
    description: jaxmd FIRE + NVT settle from Packmol / seeded mini box
    backend: jaxmd
    setup: pbc_nvt
    ps: 1.0
    jaxmd_minimize_steps: 1000
    fire_min_steps: 400
    continue_velocities: false
    # Batched NL during settle (still NVT-safe with 0.5 Å skin).
    jax_md_update_interval: 20
    steps_per_recording: 200
    output_dir: results/hybrid_mm_fixed_lj_scales_liquid/jaxmd_settle

  jaxmd_nvt:
    description: jaxmd NVT production (10 ps) — fastest ensemble knobs
    backend: jaxmd
    setup: pbc_nvt
    depends_on: jaxmd_settle
    ps: 10.0
    handoff_quality_gate: true
    handoff_quality_fmax_eVA: 1.0
    # At 1.0 fs, 40 steps ≈ 40 fs; liquid atoms stay well inside 0.5 Å skin.
    jax_md_update_interval: 40
    # 1000 × 1.0 fs = 1.0 ps / frame (enough for RDF / T series).
    steps_per_recording: 1000
    output_dir: results/hybrid_mm_fixed_lj_scales_liquid/jaxmd_nvt

  jaxmd_npt:
    description: jaxmd NpT density probe (2 ps) from NVT handoff
    backend: jaxmd
    setup: pbc_npt
    depends_on: jaxmd_nvt
    ps: 2.0
    pressure: 1.0
    # Soften piston vs default 10000*dt (~10 ps at 1.0 fs): under-dense 120@30 Å
    # box wants to shrink toward bulk; avoid slamming the cell on a 2 ps leg.
    nhc_barostat_tau: 20000.0
    handoff_quality_gate: true
    handoff_quality_fmax_eVA: 1.0
    # Tighter NL than NVT — cell moves every step; GPU Vesin covers rebuilds.
    jax_md_update_interval: 10
    steps_per_recording: 200
    output_dir: results/hybrid_mm_fixed_lj_scales_liquid/jaxmd_npt

  jaxmd_nve:
    description: short jaxmd NVE conservation check from NpT handoff
    backend: jaxmd
    setup: pbc_nve
    depends_on: jaxmd_npt
    ps: 0.5
    # Keep NL fresher for E_tot; denser recording for drift diagnosis.
    jax_md_update_interval: 10
    steps_per_recording: 100
    output_dir: results/hybrid_mm_fixed_lj_scales_liquid/jaxmd_nve
