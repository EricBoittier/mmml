# Mode A MD with trained per-type LJ scales from hybrid_mm.json
#
#   mmml md-system --config examples/hybrid_mm_charges/md_fixed_lj_scales.yaml --run-all
#
# Point checkpoint at the Mode A + learn_mm_lj_scales train run. MLpot auto-loads
# hybrid_mm.json next to the checkpoint; override with mm_lj_scales_file if needed.

defaults:
  composition: "DCM:2"
  checkpoint: /path/to/ckpts/hybrid_mm_fixed_lj_scales/<run>/params.json
  # mm_lj_scales_file: /path/to/ckpts/hybrid_mm_fixed_lj_scales/<run>/hybrid_mm.json
  spacing: 5.0
  packmol_radius: 6.9
  # Packmol's tolerance is the minimum distance between atoms of different
  # molecules, so 2.0 hands the hybrid PES Cl···H contacts near 2.07 Å — about
  # 0.9 Å inside the vdW contact distance. Every molecule here is ML, so CHARMM
  # GRMS is 0 and only the calculator can relax that; it plateaus above the
  # 2 eV/Å pre-dynamics force gate. 3.0 packs comfortably at this density.
  packmol_tolerance: 3.0
  dt_fs: 0.5
  temperature: 300.0
  seed: 42
  include_mm: true
  mm_charge_mode: fixed
  ml_switch_width: 1.5
  mm_switch_on: 8.0
  mm_switch_width: 5.0

  skip_jit_warmup: true
  quiet: true

campaign_output: results/hybrid_mm_fixed_lj_scales
runs:
  dimer_nve:
    description: Vacuum NVE — Mode A + trained LJ scales
    backend: pycharmm
    setup: free_nve
    ps: 0.05
    output_dir: results/hybrid_mm_fixed_lj_scales/dimer_nve

  # Condensed phase. jax_mic (the default mm_nonbond_mode) is the only MD path
  # that consumes ep_scale/sig_scale — periodic_external hands VDW to CHARMM
  # IMAGE, which does not read hybrid_mm.json, and MLpot now errors out rather
  # than ignoring the sidecar there. Electrostatics are therefore truncated MIC,
  # not Ewald; see docs/hybrid-mm-lj-scales.md § "Why you train LJ without Ewald".
  liquid_nvt:
    description: PBC liquid NVT — Mode A + trained LJ scales (jax_mic MM)
    backend: pycharmm
    setup: pbc_nvt
    composition: "DCM:64"
    box_size: 25.0
    mm_nonbond_mode: jax_mic
    ps: 0.05
    output_dir: results/hybrid_mm_fixed_lj_scales/liquid_nvt
