# Mode A + full-box nvalchemiops PME (matches train_fixed_nvalchemiops_pme.yaml)
#   E_Coulomb = E_PME(all atoms, q_CGenFF)   # many-to-many; no exclusions
#
#   mmml md-system --config examples/hybrid_mm_charges/md_fixed_nvalchemiops_pme.yaml --run-all
#
# Requires: PBC setup, mmml[nvalchemiops-pme], Mode A hybrid checkpoint.
# --no-periodic-charmm-vdw keeps LJ off (same as train mm_include_lj: false).

defaults:
  composition: "DCM:20"
  checkpoint: /path/to/ckpts/hybrid_mm_fixed_nval_pme/<run>/params.json
  box_size: 30.0
  dt_fs: 0.5
  temperature: 300.0
  seed: 42
  include_mm: true
  mm_charge_mode: fixed
  ml_switch_width: 1.5
  mm_switch_on: 8.0
  mm_switch_width: 5.0

  # Full-box many-to-many PME (train lr_solver: nvalchemiops_pme)
  mm_nonbond_mode: periodic_external
  lr_solver: nvalchemiops_pme
  periodic_charmm_vdw: false   # Coulomb-only; matches train LJ off

campaign_output: results/hybrid_mm_fixed_nval_pme
runs:
  box_nvt_smoke:
    description: PBC NVT smoke — Mode A + nvalchemiops full-box PME, no CHARMM VDW
    backend: pycharmm
    setup: pbc_nvt
    ps: 0.05
    output_dir: results/hybrid_mm_fixed_nval_pme/box_nvt_smoke
    extra_args:
      - --skip-jit-warmup
      - --quiet
