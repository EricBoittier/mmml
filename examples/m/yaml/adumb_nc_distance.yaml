# ADUMB on NH3–CH3Cl bond ratio (RXNCOR) — PyCHARMM only.
#
# Menshutkin / SN2-like 1D coordinate: ξ = r(Cl⋯C) / r(C⋯N)
# (CHARMM ``rxncor define … ratio`` of two distances; see rxnene.F90 RATIO_TYPE).
# Window 0.125–5.0 covers reactant-like (ξ small) through product-like (ξ large).
#
# Requires CHARMM with ADUMB + ADUMBRXNCOR (``?ADUMBRXN == 1``).
# For min>0, prefer the mmml UM1RXN patch in eadumb.F90 (exact [min,max]);
# unpatched treats the upper edge as (max−min) → ~[0.125, 4.875] here.
#
#   source examples/m/_env.sh
#   USE_NPZ_PDB=1 bash examples/m/09_adumb_nc_distance.sh
#
# Alignment (this file — 100 ps heat):
#   dt_fs=1.0, ps_heat=100 → heat nstep = 100_000
#   umbrella init: nsim=100 × update=1000 = 100_000; equi=200
# Smoke (short): ps_heat=0.2 → nstep=200; nsim=4 update=50 equi=25
#
# Pass checks:
#   1. exit 0
#   2. staged lingo has ``ratio`` + ``umbrella rxncor`` name rrat
#   3. ADUMB-WUNI.DAT / UMBCOR / RXNCOR_TRACE.DAT under output_dir
#
# Wipe output_dir/pycharmm_pre_dynamics_lingo.inp after YAML edits (09 script does).
# Docs: docs/examples/nh3-ch3cl-results.md (ADUMB section).

setup: free_nvt
backend: pycharmm
composition: "AMM1:1,CH3CL:1"
spacing: 4.0
checkpoint: examples/m/kl.json
# Mechanical embedding style for the dimer (ML + MM); use include_mm: false for ML-only.
include_mm: true
mm_switch_on: 8.0
mm_charge_mode: fixed
# jax_mic energy policy empties CHARMM nonbond lists — use JAX MM pairs (vacuum).
mm_nonbond_mode: jax_mic
mm_pair_source: jax
temperature: 300
dt_fs: 1.0
md_stages: "mini,heat"
# free_nvt → mini,heat: set ps_heat explicitly (bare ``ps`` does not override defaults).
ps_heat: 100.0
# Keep Packmol dimer compact near a typical N⋯C contact (~3–4 Å).
packmol_placement: sphere
packmol_radius: 6.0
reuse_packmol_cache: false
# --- Reactive-coordinate dynamics guards (bond breaking + forming) ---
# Chunk size = overlap check interval; keep == umbrella `update` (1000) so each
# MD block spans exactly one ADUMB update cycle. 100 chunks over 100 ps heat.
dynamics_overlap_check_interval: 1000
# CRITICAL for ADUMB: dyn_freq_cadence is the velocity-reassignment (IASVEL=1)
# micro-chunk size during the Bussi heat ramp. It MUST equal `update` so each
# thermal redraw lands on an update boundary and is absorbed by the following
# `equi` discarded steps. If it stays at the 500 default while update=1000, a
# redraw hits the MIDDLE of every recorded window (MOD(ICUM,1000)=500 > equi 200)
# and biases the umbrella statistics.
dyn_freq_cadence: 1000
# Repair without biasing the umbrella histogram: keep CHARMM SD/ABNR rescue but
# only fire it on catastrophic overlaps (0.2 Å). Normal TS/bond contacts (>1 Å)
# and the forming N–C bond never trigger it, so sampling is untouched. The NaN
# gate still guards against Fortran segfaults on blow-up.
dynamics_overlap_action: rescue
dynamics_overlap_min_distance: 0.2
dynamics_intra_min_distance: 0.2
# Fly-off guard: at ξ→5, r(Cl–C)→~7.5 Å so the CH3Cl fragment extent grows;
# raise well past the 12 Å default so dissociation is not flagged (still catches
# a true explosion beyond 25 Å).
dynamics_max_monomer_extent: 25.0
mini_nstep: 40
skip_energy_show: true
skip_jit_warmup: true
no_echeck_heat: true
quiet: false
seed: 0
mc_density_equalize: false
output_dir: artifacts/nh3_ch3cl/adumb_nc_distance

# Optional NPZ geometry:
#   USE_NPZ_PDB=1 bash examples/m/09_adumb_nc_distance.sh

# ~100 frames over 100_000 steps
dcd_nsavc: 1000
dcd_max_frames: 200

# Do NOT put PSF/PBC/nbonds/SHAKE/DYNAmics here — md-system owns those.
# Builder segids differ (packmol=CLST, --from-pdb=SYS); rxncor selects by atom
# name below so either path works. resid 1 = AMM1, resid 2 = CH3CL in both.
# OPEN names are basenames: lingo runs with cwd=output_dir (mxcmsz-safe).
# ADUMB NAME tokens are ≤4 chars (rrat).
pycharmm_pre_dynamics_lingo: |
  ! Weak COM tether: stops global drift/rotation in vacuum without confining the
  ! reaction. Acts on the aggregate COM (sele all), so it does NOT bias the
  ! internal RC ξ=r(Cl-C)/r(C-N) — that is translation-invariant.
  cons hmcm force 2.0 refx 0.0 refy 0.0 refz 0.0 sele all end

  ! Traced distance upper bound (Å); MMFP walls match so UM1RXN cannot abort.
  set adum_rcmax = 8.0
  set adum_rcwall = 500.0

  ! Filenames uppercased: library eval_charmm_script uppercases the whole card.
  open unit 44 write card name ADUMB-WUNI.DAT
  open unit 50 write card name UMBCOR
  open unit 45 write card name RXNCOR_TRACE.DAT

  ! Points: NH3 N1, CH3Cl C1, CH3Cl CL1.
  ! Selected by IUPAC atom name (``select atom * * NAME``); segid/resid-agnostic.
  rxncor define pn point select atom * * N1 end
  rxncor define pc point select atom * * C1 end
  rxncor define pcl point select atom * * CL1 end

  ! Bond distances, then SN2-like ratio ξ = r(Cl-C) / r(C-N)
  rxncor define rcl distance pcl pc
  rxncor define rcn distance pc pn
  rxncor define rrat ratio rcl rcn
  rxncor set nrxn 1 rrat
  rxncor trace rrat unit 45

  ! Soft outer walls on Cl-C and C-N: installed from Python before umbrella
  ! (see ``set adum_rcmax`` / ``set adum_rcwall`` above).

  ! Adaptive umbrella on ξ ∈ [0.125, 5.0] (dimensionless).
  ! min>0 needs UM1RXN [min,max] patch for the exact upper edge (see header).
  umbrella rxncor nresol 40 trig 0 poly 6 min 0.125 max 5.0 name rrat

  ! nsim * update must equal heat nstep (ps_heat*1000/dt_fs = 100_000 here)
  umbrella init nsim 100 update 1000 equi 200 thresh 10 temp 300 wuni 44 ucun 50
