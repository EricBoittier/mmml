# ADUMB on NH3–CH3Cl N⋯C distance (RXNCOR) — PyCHARMM only.
#
# Yes: the examples/m NPZ can feed this path after export to a CGenFF PDB
# (07_export_solute_pdb.py) or via Packmol composition AMM1:1,CH3CL:1
# (same residues; geometry from CGenFF templates unless you --from-pdb).
#
# Why not umbrella dihe? AMM1/CH3CL have no peptide φ/ψ. The natural
# reaction coordinate is the heavy-atom separation (N1–C1), via RXNCOR +
# ADUMB RXNCOR (see setup/charmm/test/c38test/adumbrxncor.inp).
#
# Requires CHARMM built with ADUMB + ADUMBRXN (``?ADUMBRXN == 1``).
#
#   source examples/m/_env.sh
#   uv run mmml md-system --config examples/m/yaml/adumb_nc_distance.yaml
#   # or: bash examples/m/09_adumb_nc_distance.sh
#
# Alignment (smoke):
#   dt_fs=1.0, ps=0.2 → heat nstep ≈ 200
#   umbrella init: nsim=4 × update=50 = 200 steps; equi=25
#
# Pass checks:
#   1. exit 0
#   2. {output_dir}/pycharmm_pre_dynamics_lingo.inp contains ``umbrella rxncor``
#   3. Log prints ``Pre-dynamics CHARMM lingo`` before heat
#   4. adumb-wuni.dat / umbcor / rxncor_trace.dat appear under output_dir

setup: free_nvt
backend: pycharmm
composition: "AMM1:1,CH3CL:1"
spacing: 4.0
checkpoint: examples/m/kl.json
# Mechanical embedding style for the dimer (ML + MM); use include_mm: false for ML-only.
include_mm: true
mm_charge_mode: fixed
temperature: 300
dt_fs: 1.0
# free_nvt → mini,heat: set ps_heat explicitly (bare ``ps`` does not override defaults).
ps_heat: 0.2
# Keep Packmol dimer compact for the N⋯C umbrella window [2, 6] Å.
# (Default cube placement can park monomers ~box-length apart along one axis.)
packmol_placement: sphere
packmol_radius: 6.0
reuse_packmol_cache: false
# MMFP wall; cons hmcm in pre-dynamics lingo is the primary COM restraint.
flat_bottom_radius: 20.0
mini_nstep: 40
skip_energy_show: true
skip_jit_warmup: true
no_echeck_heat: true
quiet: false
seed: 0
mc_density_equalize: false
output_dir: artifacts/nh3_ch3cl/adumb_nc_distance

# Optional NPZ geometry (do not keep multi-token composition with from_pdb):
#   composition: artifacts/nh3_ch3cl/solute_amm1_ch3cl.pdb
#   from_pdb: artifacts/nh3_ch3cl/solute_amm1_ch3cl.pdb
# Or: USE_NPZ_PDB=1 bash examples/m/09_adumb_nc_distance.sh
# (script overrides composition to the lone PDB).

dcd_nsavc: 10
dcd_max_frames: 100

# Do NOT put PSF/PBC/nbonds/SHAKE/DYNAmics here — md-system owns those.
# Packmol/composition builds segment SYS: resid 1 = AMM1, resid 2 = CH3CL.
pycharmm_pre_dynamics_lingo: |
  ! Keep the complex near the origin during vacuum heat
  cons hmcm force 5.0 refx 0.0 refy 0.0 refz 0.0 sele all end

  open unit 44 write card name artifacts/nh3_ch3cl/adumb_nc_distance/adumb-wuni.dat
  open unit 50 write card name artifacts/nh3_ch3cl/adumb_nc_distance/umbcor
  open unit 45 write card name artifacts/nh3_ch3cl/adumb_nc_distance/rxncor_trace.dat

  ! Reaction coordinate: AMM1 N1 ⋯ CH3CL C1 (Å)
  rxncor define p_n point select atom SYS 1 N1 end
  rxncor define p_c point select atom SYS 2 C1 end
  rxncor define r_nc distance p_n p_c
  rxncor set nrxn 1 r_nc
  rxncor trace r_nc unit 45

  ! Adaptive umbrella on r_nc over [2.0, 6.0] Å
  umbrella rxncor nresol 40 trig 0 poly 6 min 2.0 max 6.0 name r_nc

  ! nsim * update must match heat nstep (ps*1000/dt_fs ≈ 200 here)
  umbrella init nsim 4 update 50 equi 25 thresh 10 temp 300 wuni 44 ucun 50
