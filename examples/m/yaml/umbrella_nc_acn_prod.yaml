# Solvated mechanical-embedding umbrella — production (dense ACN @ 30 Å).
#
# Reaction coordinate (1D PMF):
#   ξ = r(C–Cl) − r(C–N)     [= ADUMB ``rdif`` / Menshutkin convention]
#   reactants: ξ < 0   |   products: ξ > 0
#
# Same CV / ML region / walls as umbrella_nc_acn.yaml; longer sampling for MBAR.
# Prerequisite: dense make-box (USE_DENSITY=1):
#   USE_DENSITY=1 BOX_SIZE=30 SOLVENT_ONLY=acn bash examples/m/08_make_boxes.sh
#
#   source examples/m/_env.sh
#   SOLVENT=acn bash examples/m/14_umbrella_sample_sol_prod.sh
#
# Timing (defaults): 30 windows × 80000 steps × 0.25 fs = 20 ps / window;
#   equilibration_steps 8000 → 2 ps discarded; ~401 saved frames / window.
# 0.25 fs matches Menshutkin gas practice (PhysNet + H unstable at 0.5 fs near TS).

engine: hybrid_jaxmd
checkpoint: ../../model_ext.json
from_psf: ../../../artifacts/nh3_ch3cl/boxes/acn/model.psf
from_pdb: ../../../artifacts/nh3_ch3cl/boxes/acn/model.pdb
box_size: 30.0
output_dir: ../../../artifacts/nh3_ch3cl/umbrella_nc_acn_prod

ml_resnames: [AMM1, CH3CL]

cv_x:
  pairs:
    - [C1, CL1]
    - [C1, N1]
  coefficients: [1.0, -1.0]

walls:
  - pairs: [[C1, CL1], [C1, N1]]
    r_max: 2.25
    k: 100.0
  - atoms: [N1, C1, CL1]
    theta_min_deg: 130.0
    k: 50.0

xi_min: -1.3
xi_max: 1.6
n_windows: 30
k_ev_A2: 6.505

temperature_K: 300.0
timestep_fs: 0.25
nsteps: 80000
equilibration_steps: 8000
printfreq: 1000
savefreq: 200
seed: 0
seed_mode: stretch
overwrite: false
lr_solver: mic
# Seeding rigidly displaces the solute by up to ~2.5 Å inside a box packed at
# ξ≈-0.86, so the solvent must move aside before dynamics starts. Without this,
# every window past ξ≈+0.6 aborted non-finite within ~1 ps.
relax_seed_steps: 300
relax_seed_fmax: 1.0
# Gate is the ML-region max |F|. The whole-system max is useless here: raw
# Packmol solvent contacts (2.0 Å tolerance) pin it near 37 eV/Å identically in
# every window. Recalibrate from the seed_max|F|_ML column once a run is in.
max_seed_force: 80.0
