# Solvated mechanical-embedding umbrella (TIP3, 30 Å make-box).
#
# ML region = AMM1+CH3CL as one complex; solvent = MM intermolecular.
# Prerequisite: bash examples/m/08_make_boxes.sh  (or run_sol_tip3_30A.sh)
#
#   source examples/m/_env.sh
#   bash examples/m/14_umbrella_sample_sol.sh
#   # or:
#   uv run mmml umbrella-sample --config examples/m/yaml/umbrella_nc_tip3.yaml --overwrite

engine: hybrid_jaxmd
checkpoint: ../model_ext.json
from_psf: ../../artifacts/nh3_ch3cl/boxes/tip3/model.psf
from_pdb: ../../artifacts/nh3_ch3cl/boxes/tip3/model.pdb
box_size: 30.0
output_dir: ../../artifacts/nh3_ch3cl/umbrella_nc_tip3

ml_resnames: [AMM1, CH3CL]
# CV: N–C distance (names resolved in the ML region / PSF)
atom_name_i: C1
atom_name_j: N1
# Placeholder indices (overridden by atom_name_* when PSF is present)
atom_i: 0
atom_j: 1

xi_min: 2.2
xi_max: 3.2
n_windows: 3
k_ev_A2: 5.0

temperature_K: 300.0
timestep_fs: 0.5
nsteps: 40
printfreq: 20
savefreq: 20
seed: 0
seed_mode: stretch
overwrite: false
lr_solver: mic
