# Solvated mechanical-embedding umbrella — smoke (TIP3 make-box).
#
# ML region = AMM1+CH3CL; solvent = MM intermolecular.
# Prerequisite: bash examples/m/08_make_boxes.sh
#
#   source examples/m/_env.sh
#   bash examples/m/14_umbrella_sample_sol.sh
#
# Production (dense box, 20 ps/window): yaml/umbrella_nc_tip3_prod.yaml
#   bash examples/m/14_umbrella_sample_sol_prod.sh

engine: hybrid_jaxmd
checkpoint: ../../model_ext.json
from_psf: ../../../artifacts/nh3_ch3cl/boxes/tip3/model.psf
from_pdb: ../../../artifacts/nh3_ch3cl/boxes/tip3/model.pdb
box_size: 30.0
output_dir: ../../../artifacts/nh3_ch3cl/umbrella_nc_tip3

ml_resnames: [AMM1, CH3CL]
atom_name_i: C1
atom_name_j: N1
atom_i: 0
atom_j: 1

xi_min: 2.2
xi_max: 3.2
n_windows: 3
k_ev_A2: 5.0

temperature_K: 300.0
timestep_fs: 0.5
nsteps: 40
printfreq: 20
savefreq: 20
seed: 0
seed_mode: stretch
overwrite: false
lr_solver: mic
max_seed_force: 30.0
