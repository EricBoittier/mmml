# Mechanical embedding from a make-box artifact (after 08_make_boxes.sh).
#   bash examples/m/08_make_boxes.sh
#   uv run mmml md-system --config examples/m/yaml/mech_embed_from_box_tip3.yaml --run-all
#
# Sibling box.json next to model.pdb supplies the cell. ASE / legacy JAX-MD /
# PyCHARMM only (``--jaxmd-unified`` is packmol-composition-only today).
# For jaxmd-unified mechanical embedding from this PDB, use sol_tip3_30A_md.yaml
# (model_ext.json + ml_resnames: [AMM1, CH3CL]).

defaults:
  from_pdb: artifacts/nh3_ch3cl/boxes/tip3/model.pdb
  checkpoint: examples/m/model_ext.json
  setup: pbc_nve
  ps: 0.05
  dt_fs: 0.5
  temperature: 300
  include_mm: true
  mm_switch_on: 8.0
  skip_jit_warmup: true
  quiet: true
  seed: 0
  mc_density_equalize: false

campaign_output: artifacts/nh3_ch3cl/mech_embed_from_box_tip3

runs:
  ase:
    backend: ase
    output_dir: artifacts/nh3_ch3cl/mech_embed_from_box_tip3/ase

  jaxmd:
    backend: jaxmd
    output_dir: artifacts/nh3_ch3cl/mech_embed_from_box_tip3/jaxmd

  pycharmm:
    backend: pycharmm
    mini_nstep: 20
    skip_energy_show: true
    skip_jit_warmup: false
    output_dir: artifacts/nh3_ch3cl/mech_embed_from_box_tip3/pycharmm
