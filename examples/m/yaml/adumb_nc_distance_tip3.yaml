# ADUMB Cl⋯C − C⋯N bond difference in explicit TIP3 (PBC) — after vacuum smoke.
# Same ξ = r(Cl-C)−r(C-N) ∈ [-3, 3] as adumb_nc_distance.yaml (smoke lengths).
#
#   source examples/m/_env.sh
#   SOLVATED=1 bash examples/m/09_adumb_nc_distance.sh
#
# Alignment: dt_fs=1.0, ps_prod=1.0 → prod nstep=1000
#   umbrella: nsim=10 × update=100 = 1000; equi=100

setup: pbc_nvt
backend: pycharmm
composition: "AMM1:1,CH3CL:1,TIP3:12"
box_size: 30.0
checkpoint: examples/m/model_ext.json
include_mm: true
mm_switch_on: 8.0
mm_charge_mode: fixed
mm_nonbond_mode: jax_mic
lr_solver: mic
temperature: 300
dt_fs: 1.0
md_stages: "mini,heat,prod"
ps_heat: 0.2
ps_prod: 1.0
mini_nstep: 40
skip_energy_show: true
skip_jit_warmup: true
quiet: false
seed: 0
mc_density_equalize: false
output_dir: artifacts/nh3_ch3cl/adumb_nc_distance_tip3

# --- Reactive-coordinate dynamics guards (PBC + explicit solvent) ---
# Chunk size = overlap check interval; align to umbrella `update` (100) so each
# MD block spans one ADUMB update cycle (200/100 heat, 1000/100 prod).
dynamics_overlap_check_interval: 100
# Velocity-reassignment micro-chunk cadence == update (100) so redraws land on
# update boundaries and are absorbed by `equi`.
dyn_freq_cadence: 100
# Fly-off guard raised modestly (still < 30 Å box) for the dissociating fragment.
dynamics_max_monomer_extent: 20.0
# NOTE: close-contact / repair thresholds are deliberately left at solvent-safe
# defaults. Do NOT copy the vacuum files' dynamics_overlap_min_distance: 0.2 —
# with explicit TIP3 that would let solvent–solvent overlaps go unrescued.
# Reactive C–Cl contacts must not trigger CHARMM SD rescue mid-umbrella.
dynamics_overlap_action: warn
no_echeck_heat: true

dcd_nsavc: 20
dcd_max_frames: 200

# OPEN names are basenames: lingo runs with cwd=output_dir (mxcmsz-safe).
pycharmm_pre_dynamics_lingo: |
  ! Soft COM restraint on the solute (resid 1-2); leave solvent free
  cons hmcm force 2.0 refx 0.0 refy 0.0 refz 0.0 -
    sele (resid 1 .or. resid 2) end

  ! CGenFF BOND C1–CL1 stays in ENER INTERN and blocks SN2; PhysNet owns it.
  delete bond sele atom * * CL1 end sele atom * * C1 end
  delete angle sele atom * * CL1 end sele atom * * C1 end

  set adumrcmax = 8.0
  set adumrcwall = 500.0

  ! Filenames uppercased: library eval_charmm_script uppercases the whole card.
  open unit 44 write card name ADUMB-WUNI.DAT
  open unit 50 write card name UMBCOR
  open unit 45 write card name RXNCOR_TRACE.DAT

  ! Points selected by atom NAME only (segid/resid-agnostic): works under both
  ! packmol (segid CLST) and --from-pdb / NPZ-frame seeding (segid SYS).
  rxncor define pn point select atom * * N1 end
  rxncor define pc point select atom * * C1 end
  rxncor define pcl point select atom * * CL1 end
  rxncor define rcl distance pcl pc
  rxncor define rcn distance pc pn
  rxncor define rdif combination rcl 1.0 rcn -1.0
  rxncor set nrxn 1 rdif
  rxncor trace rdif unit 45

  ! RC outer walls: RESDistance POSITIVE by default; ``MMML_ADUMB_RC_WALL_BACKEND=off`` to disable.

  ! Same window as vacuum 1D (matches component walls; see adumb_nc_distance.yaml)
  umbrella rxncor nresol 40 trig 0 poly 6 min -6.0 max 6.0 name rdif
  ! equi MUST be < update or MOD(ICUM,update) > equi is never true and ADUMB
  ! records ZERO statistics. equi 20 of update 100 → 80% of each window sampled.
  umbrella init nsim 10 update 100 equi 20 temp 300 wuni 44 ucun 50
  umbrella ston
