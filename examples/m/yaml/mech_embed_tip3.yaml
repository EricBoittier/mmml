# Mechanical embedding (legacy cg_jax style): ML solute complex + MM intermolecular.
# Solute AMM1+CH3CL in TIP3. Run after: source examples/m/_env.sh
#
#   uv run mmml md-system --config examples/m/yaml/mech_embed_tip3.yaml --run-all
#
# JAX-MD ``jaxmd_unified`` uses ml_resnames so PhysNet evaluates AMM1+CH3CL once;
# MM owns solute–solvent / solvent–solvent. ASE / PyCHARMM use the hybrid
# calculator with include_mm (legacy path still ML-evaluates every monomer).

defaults:
  composition: "AMM1:1,CH3CL:1,TIP3:12"
  box_size: 30.0
  checkpoint: examples/m/model_ext.json
  setup: pbc_nve
  ps: 0.05
  dt_fs: 0.5
  temperature: 300
  include_mm: true
  mm_switch_on: 8.0
  ml_resnames: [AMM1, CH3CL]
  skip_jit_warmup: true
  quiet: true
  seed: 0
  mc_density_equalize: false

campaign_output: artifacts/nh3_ch3cl/mech_embed_tip3

runs:
  ase:
    description: "Mechanical embedding PBC NVE — ASE"
    backend: ase
    output_dir: artifacts/nh3_ch3cl/mech_embed_tip3/ase

  jaxmd:
    description: "Mechanical embedding PBC NVE — JAX-MD unified (cg_jax)"
    backend: jaxmd
    jaxmd_unified: true
    output_dir: artifacts/nh3_ch3cl/mech_embed_tip3/jaxmd

  pycharmm:
    description: "Mechanical embedding PBC NVE — PyCHARMM MLpot"
    backend: pycharmm
    mini_nstep: 20
    skip_energy_show: true
    skip_jit_warmup: false
    output_dir: artifacts/nh3_ch3cl/mech_embed_tip3/pycharmm

# Trajectory output (PyCHARMM → DCD+PSF; ASE/jaxmd → .traj under output_dir)
dcd_nsavc: 1
dcd_max_frames: 50
