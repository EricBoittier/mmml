# Mechanical embedding from make-box ACN box (after 08_make_boxes.sh).
#   uv run mmml md-system --config examples/m/yaml/mech_embed_from_box_acn.yaml --run-all

defaults:
  from_pdb: artifacts/nh3_ch3cl/boxes/acn/model.pdb
  checkpoint: examples/m/kl.json
  setup: pbc_nve
  ps: 0.05
  dt_fs: 0.5
  temperature: 300
  include_mm: true
  mm_switch_on: 8.0
  skip_jit_warmup: true
  quiet: true
  seed: 0
  mc_density_equalize: false

campaign_output: artifacts/nh3_ch3cl/mech_embed_from_box_acn

runs:
  ase:
    backend: ase
    output_dir: artifacts/nh3_ch3cl/mech_embed_from_box_acn/ase

  jaxmd:
    backend: jaxmd
    output_dir: artifacts/nh3_ch3cl/mech_embed_from_box_acn/jaxmd

  pycharmm:
    backend: pycharmm
    mini_nstep: 20
    skip_energy_show: true
    skip_jit_warmup: false
    output_dir: artifacts/nh3_ch3cl/mech_embed_from_box_acn/pycharmm
