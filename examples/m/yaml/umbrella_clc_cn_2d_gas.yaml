# 2D fixed-bias umbrella (gas phase): Cl–C × N–C distances.
#
#   uv run mmml umbrella-sample --config examples/m/yaml/umbrella_clc_cn_2d_gas.yaml --overwrite

checkpoint: ../kl.json
structure: ../neb/reag_0_opt.xyz
output_dir: ../../artifacts/nh3_ch3cl/umbrella_clc_cn_2d_gas

atom_i: 0
atom_j: 2
atom_k: 1
atom_l: 2
move_with: [1, 3, 4, 5]
move_with2: [1, 3, 4, 5]
invert_with: [6, 7, 8]

xi_min: 1.8
xi_max: 3.0
n_windows: 3
yi_min: 1.8
yi_max: 3.0
n_windows_y: 3
k_ev_A2: 10.0
k_y_ev_A2: 10.0

temperature_K: 300.0
timestep_fs: 0.1
nsteps: 100
printfreq: 50
seed: 0
seed_mode: stretch
overwrite: false
