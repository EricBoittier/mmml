# 1D gas-phase umbrella on central TRIA ψ (N2–CA2–C2–N3).
# Same workflow as umbrella_phi_gas.yaml; export seeds with --cv psi.

engine: packed_ml
checkpoint: examples/sppoky-epoch-0010_params.json
structure: artifacts/tria_phi_psi_scan/gas/umbrella_psi_seeds.npz
seed_mode: frames
structure_index: 0

cv_x:
  kind: dihedral
  atoms: [16, 18, 24, 26]   # PSI_CENTRAL

xi_min: -180
xi_max: 180
n_windows: 13
k_ev_A2: 0.05               # eV/deg²

temperature_K: 300
timestep_fs: 0.25
nsteps: 4000
equilibration_steps: 1000
thermostat: langevin
langevin_gamma: 0.1
seed: 0

output_dir: artifacts/tria_phi_psi_scan/umbrella_psi_gas
overwrite: true
