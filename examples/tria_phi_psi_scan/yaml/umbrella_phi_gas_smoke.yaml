# Short gas φ umbrella smoke (7 windows × ~0.5 ps production).

engine: packed_ml
checkpoint: examples/sppoky-epoch-0010_params.json
structure: artifacts/tria_phi_psi_scan/gas/umbrella_phi_seeds.npz
seed_mode: frames
structure_index: 0

cv_x:
  kind: dihedral
  atoms: [14, 16, 18, 24]

xi_min: -180
xi_max: 180
n_windows: 7
k_ev_A2: 0.05

temperature_K: 300
timestep_fs: 0.25
nsteps: 2000
equilibration_steps: 500
thermostat: langevin
langevin_gamma: 0.1
seed: 0

output_dir: artifacts/tria_phi_psi_scan/umbrella_phi_gas_smoke
overwrite: true
