# 1D gas-phase umbrella on central TRIA φ (C1–N2–CA2–C2).
#
# Seed from a gas φ/ψ scan NPZ (frame-per-window), then packed_ml NVT.
# Targets / k are in degrees / eV/deg² (periodic shortest-arc bias).
#
#   # after gas scan → export seeds (see README)
#   uv run mmml umbrella-sample --config examples/tria_phi_psi_scan/yaml/umbrella_phi_gas.yaml

engine: packed_ml
checkpoint: examples/sppoky-epoch-0010_params.json
structure: artifacts/tria_phi_psi_scan/gas/umbrella_phi_seeds.npz
seed_mode: frames
structure_index: 0

cv_x:
  kind: dihedral
  atoms: [14, 16, 18, 24]   # PHI_CENTRAL

xi_min: -180
xi_max: 180
n_windows: 13               # 30° spacing
k_ev_A2: 0.05               # eV/deg² (soft; raise if windows drift)

temperature_K: 300
timestep_fs: 0.25
nsteps: 4000
equilibration_steps: 1000
thermostat: langevin
langevin_gamma: 0.1
seed: 0

output_dir: artifacts/tria_phi_psi_scan/umbrella_phi_gas
overwrite: true
