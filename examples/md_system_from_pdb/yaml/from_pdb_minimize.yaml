# Full-system PDB → PyCHARMM minimize only.
#
#   uv run mmml md-system --config examples/md_system_from_pdb/yaml/from_pdb_minimize.yaml
#
# Override paths from the repo root if needed:
#   --from-pdb /abs/path.pdb --checkpoint /abs/ckpt.json --output-dir ...

setup: pycharmm_minimize
backend: pycharmm
from_pdb: mmml/generate/sample/pdb/aco_monomer.pdb
checkpoint: examples/ckpts_json/DESdimers_params.json
mini_nstep: 30
skip_energy_show: true
output_dir: artifacts/md_system_from_pdb/yaml_mini_pycharmm
seed: 42
