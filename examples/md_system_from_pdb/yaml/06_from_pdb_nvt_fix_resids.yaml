# 06 — Packmol 4-mer → free_nvt with constrained SD (fix-resids 1,3)
#
#   uv run mmml md-system --config examples/md_system_from_pdb/yaml/06_from_pdb_nvt_fix_resids.yaml
#   bash examples/md_system_from_pdb/06_from_pdb_nvt_fix_resids.sh
#
# Pass check: fixed monomers should have RMSD ≈ 0 after SD pass 2.

setup: free_nvt
backend: pycharmm
composition: "mmml/generate/sample/pdb/aco_monomer.pdb:4"
checkpoint: examples/ckpts_json/DESdimers_params.json
packmol_radius: 15.0
flat_bottom_radius: 12.0
fix_resids: "1,3"
temperature: 300.0
ps: 0.1
dt_fs: 0.5
mini_nstep: 30
skip_energy_show: true
quiet: true
output_dir: artifacts/md_system_from_pdb/06_nvt_fix_resids
seed: 42
