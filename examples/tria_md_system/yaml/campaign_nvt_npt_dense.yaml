# Denser TRIA + TIP3 mechanical embedding — meaningful NPT pressure smoke.
#
# Build first (do NOT use 200 waters in 20 Å — Packmol overpacks → E0 ~ 1e6 eV):
#   uv run mmml md-embedding build \
#     -o artifacts/md_embedding/aaa_dense \
#     --n-waters 200 \
#     --box-side-A 30
#   awk '/^ATOM/{print substr($0,18,4)}' artifacts/md_embedding/aaa_dense/model.pdb | sort -u
#
# Sanity: liquid water ~30 Å^3/molecule → 200 waters alone want L~18–20 Å;
# peptide + Packmol padding needs ~28–32 Å. Use L=30 for 200 TIP3.
#
#   export MMML_CKPT=examples/sppoky-epoch-0010_params.json   # known-good for TRIA
#   uv run mmml md-system \
#     --config examples/tria_md_system/yaml/campaign_nvt_npt_dense.yaml \
#     --checkpoint "$MMML_CKPT" \
#     --run-all
#
# Sense-check: NPT log prints P0, Pkin0, Pvir0. Cold-start (no handoff yet).
# Pkin0 should be O(N kT / V); |P0| should be far below dilute aaa ~10^3 bar
# once packing is liquid-like. Instantaneous P still fluctuates on short runs.

defaults:
  from_pdb: artifacts/md_embedding/aaa_dense/model.pdb
  checkpoint: examples/sppoky-epoch-0010_params.json
  interaction_policy: examples/interaction_policy_tria_tip3_mech.yaml
  backend: jaxmd
  jaxmd_unified: true
  include_mm: true
  mm_switch_on: 8.0
  temperature: 300
  pressure: 1.0
  # Packed hybrid: 0.5 fs + NHC was NaNing after good E0; Langevin + 0.25 fs.
  # FIRE before dynamics (jaxmd-unified) — Packmol cold starts need it.
  dt_fs: 0.25
  nvt_integrator: langevin
  jaxmd_minimize_steps: 250
  seed: 0
  skip_jit_warmup: true
  quiet: true
  mc_density_equalize: false
  ml_resnames: [TRIA]

campaign_output: artifacts/tria_md_system/campaign_dense

runs:
  nvt:
    description: "NVT Langevin thermalize denser box (cold start)"
    setup: pbc_nvt
    ps: 0.2
    output_dir: artifacts/tria_md_system/campaign_dense/nvt

  npt:
    description: "NPT with moderate barostat tau (still short; not full equilibration)"
    setup: pbc_npt
    ps: 0.2
    # Smaller than dilute-smoke 1e6, larger than jax-md default 1000*dt.
    barostat_tau: 5.0e4
    output_dir: artifacts/tria_md_system/campaign_dense/npt

  nve:
    description: "Short NVE after cold-start (no handoff yet)"
    setup: pbc_nve
    ps: 0.05
    output_dir: artifacts/tria_md_system/campaign_dense/nve
