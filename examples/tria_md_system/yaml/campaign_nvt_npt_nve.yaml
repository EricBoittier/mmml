# TRIA + TIP3 mechanical embedding via md-system + interaction policy.
#
# Prerequisite (CHARMM node):
#   uv run mmml md-embedding build -o artifacts/md_embedding/aaa --n-waters 10
#   # writes model.psf / model.crd / model.pdb + box.json
#
# Smoke campaign (jaxmd-unified). Legs chain via ``depends_on`` (geometry
# handoff: positions + box; velocities rethermalized; FIRE skipped after NVT).
#
# NPT pass on this short smoke: finite E + finite V + Vfinal/V0 in [0.5, 2]
# (see driver volume gate). Not a density-equilibration criterion.
# ``pressure`` is treated as bar by EnsembleSpec (CLI help still says atm).
# Dilute aaa boxes need ``barostat_tau`` raised (see npt job) or NPT NaNs.
#
#   export MMML_CKPT=examples/spooky_so3lr_muon3_epoch0013.json   # optional
#   uv run mmml md-system \
#     --config examples/tria_md_system/yaml/campaign_nvt_npt_nve.yaml \
#     --run-all
#
# Single leg:
#   uv run mmml md-system --config ... --job-id nve

defaults:
  from_pdb: artifacts/md_embedding/aaa/model.pdb
  checkpoint: examples/spooky_so3lr_muon3_epoch0013.json
  interaction_policy: examples/interaction_policy_tria_tip3_mech.yaml
  # Also accepted: ../../interaction_policy_tria_tip3_mech.yaml (resolved vs this YAML).
  backend: jaxmd
  jaxmd_unified: true
  include_mm: true
  mm_switch_on: 8.0
  temperature: 300
  # Target pressure for jax-md NPT (bar; ~atm numerically).
  pressure: 1.0
  dt_fs: 0.5
  seed: 0
  skip_jit_warmup: true
  quiet: true
  mc_density_equalize: false
  # Policy lowers to ml_resnames: [TRIA]; keep explicit for clarity / overrides.
  ml_resnames: [TRIA]

campaign_output: artifacts/tria_md_system/campaign

runs:
  nvt:
    description: "Short PBC NVT smoke (mechanical embedding)"
    setup: pbc_nvt
    ps: 0.05
    output_dir: artifacts/tria_md_system/campaign/nvt

  npt:
    description: "Short PBC NPT smoke from NVT handoff"
    setup: pbc_npt
    depends_on: nvt
    ps: 0.05
    # Soft Nose–Hoover piston (jax-md metal time). The aaa 28 Å / 10-water box
    # sits near P_inst ~ -10^3 bar; default tau=1000*dt compresses into NaN.
    # This keeps Vfinal/V0~1 on the smoke — not a density-equilibration test.
    barostat_tau: 1.0e6
    output_dir: artifacts/tria_md_system/campaign/npt

  nve:
    description: "Short PBC NVE smoke from NPT handoff"
    setup: pbc_nve
    depends_on: npt
    ps: 0.05
    output_dir: artifacts/tria_md_system/campaign/nve
