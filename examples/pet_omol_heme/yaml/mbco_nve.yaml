# Sperm-whale MbCO, vacuum, PET-OMOL S on the His93 imidazole + heme + CO.
#
#   export PET_OMOL_S_CKPT=$PWD/pet-omol-s-v1.0.0.pt
#   uv run --no-sync mmml md-system --config examples/pet_omol_heme/yaml/mbco_nve.yaml --checkpoint "$PET_OMOL_S_CKPT"
#
# See examples/pet_omol_heme/README.md section 4.

residue: MBCO
n_molecules: 1
builder: gas
backend: pycharmm
setup: free_nve
mm_region: his93
checkpoint: ${PET_OMOL_S_CKPT}
ml_potential_mode: metatomic
metatomic_eval_mode: whole_system
include_mm: false
dynamics_max_monomer_extent: 100
temperature: 300.0
dt_fs: 0.5
mini_nstep: 20
ps_nve: 0.05
output_dir: scratch/pet_omol_mbco
extra_args:
  - --no-include-mm
  - --no-echeck
