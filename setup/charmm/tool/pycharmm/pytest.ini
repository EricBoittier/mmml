[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -m "not slow and not stateful"
strict_markers = true
strict_config = true
markers =
    slow: long-running tests (>60s); skipped by default. Run with
          `pytest -m slow` or `pytest -m "slow or not slow"`.
    stateful: tests that leak CHARMM global state (parameter table,
              image setup, nbond options, etc.) into subsequent tests
              and must be run alone or in subprocess isolation.
              Skipped by default. Run with `pytest -m stateful` to
              exercise them one-at-a-time.
    requires_feature(name): mark a test as needing a particular
              compile-time `pref.dat` keyword (`BLADE`, `OPENMM`, ...).
              The conftest auto-skip hook checks
              `pycharmm.keywords.has(name)` and skips the test on
              builds where the feature isn't present. Multiple
              positional args are AND-ed (all must be present).
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
