name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  html:
    name: MkDocs HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install "3.13"
      - name: Install docs dependencies
        run: uv sync --extra dev --extra all-cpu
      - name: Build docs
        run: |
          uv run python scripts/generate_cli_docs.py --check
          uv run python scripts/generate_docs_figures.py --check
          uv run python scripts/generate_crystal_lit_compare.py --check
          uv run python scripts/plot_mlpot_settings.py
          uv run mkdocs build --strict

  pdf:
    name: PDF Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install PDF dependencies
        run: |
          uv sync --extra dev --extra all-cpu
          uv pip install reportlab
          npm install --global @mermaid-js/mermaid-cli
      - name: Configure Mermaid renderer
        run: |
          cat > mermaid-puppeteer-config.json <<'EOF'
          {
            "args": ["--no-sandbox", "--disable-setuid-sandbox"]
          }
          EOF
      - name: Build PDF docs
        env:
          MMML_MERMAID_PUPPETEER_CONFIG: mermaid-puppeteer-config.json
        run: |
          uv run python scripts/generate_cli_docs.py --check
          uv run python scripts/generate_docs_figures.py --check
          uv run python scripts/generate_crystal_lit_compare.py --check
          uv run python scripts/plot_mlpot_settings.py
          uv run python scripts/build_docs_pdf.py
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmml-docs-pdf
          path: site/mmml-docs.pdf
