name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-mmml
      - name: Lint
        id: lint
        continue-on-error: true
        run: make lint
      - name: Duplicate definitions / conflict markers
        id: dupes
        continue-on-error: true
        run: make lint-dupes
      - name: Package import sanity
        if: always()
        run: |
          uv run python -V
          uv run python -c "import mmml; print('package imports ok')"
          uv run python -c "import mmml.md.energy.terms; print('energy terms import ok')"
      - name: Lint gate
        if: always()
        run: |
          fail=0
          [ "${{ steps.lint.outcome }}" = "failure" ] && { echo "::error::make lint failed"; fail=1; }
          [ "${{ steps.dupes.outcome }}" = "failure" ] && { echo "::error::make lint-dupes failed (duplicate defs or conflict markers)"; fail=1; }
          exit "$fail"

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-mmml
        with:
          # jax-pme-solver is not part of all-cpu. Without it, 19 files skip via
          # have_jax_pme_package() and pytest still exits 0.
          sync-args: "--extra dev --extra all-cpu --extra jax-pme-solver"
      - name: jax-pme backend importable
        run: uv run python -c "from jaxpme import PME, P3M, Ewald; print('jax-pme backend importable')"
      - name: Run unit tests
        run: |
          mkdir -p .ci-reports
          uv run pytest -v --color=yes --cov=mmml --cov-report=xml \
            --junitxml=.ci-reports/junit-unit.xml tests/unit
      - name: Unit suite ran for real
        if: always()
        run: |
          uv run python scripts/ci/check_test_report.py .ci-reports/junit-unit.xml \
            --label "unit suite" --min-passed 3000 --max-skipped-frac 0.25
      # Coverage floor, not a coverage target. Roughly 18.7k statements need
      # live CHARMM, 10.9k are plotting and 5.3k need PySCF/torch/GPU, so the
      # CI-reachable ceiling is near 70%. This catches a *slide*. Measured
      # 2026-08-01 on a full MMML_DISABLE_CHARMM=1 run: 45.81%, 55706 of
      # 121608 lines. The floors sit ~3.8pp and ~6.6% below that.
      - name: Coverage floor
        if: always()
        run: |
          uv run python scripts/ci/check_coverage_floor.py coverage.xml \
            --label "unit coverage" --min-percent 42 --min-covered-lines 52000
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  extra:
    name: Functionality tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-mmml
        with:
          sync-args: "--extra dev --extra all-cpu --extra jax-pme-solver"
      - name: Run functionality / misc / integration tests
        run: |
          mkdir -p .ci-reports
          uv run pytest -v --color=yes \
            --junitxml=.ci-reports/junit-extra.xml \
            tests/functionality tests/misc tests/integration \
            -m "not pycharmm"
      - name: Extra suite ran for real
        if: always()
        run: |
          uv run python scripts/ci/check_test_report.py .ci-reports/junit-extra.xml \
            --label "functionality suite" --min-passed 10 --max-skipped-frac 0.85

  charmm-mpi:
    name: CHARMM MPI units
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-mmml
        with:
          sync-args: "--extra dev --extra all-cpu --extra jax-pme-solver"
      - name: Run CHARMM MPI unit suite
        run: |
          mkdir -p .ci-reports
          uv run pytest -v --color=yes tests/charmm_mpi/ \
            -m "charmm_mpi and not pycharmm" --junitxml=.ci-reports/junit-charmm-mpi.xml
      - name: CHARMM MPI suite ran for real
        if: always()
        run: |
          uv run python scripts/ci/check_test_report.py .ci-reports/junit-charmm-mpi.xml \
            --label "charmm_mpi suite" --min-passed 15 --max-skipped 5

  charmm:
    name: PyCHARMM smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install "3.13"
      - name: Install CHARMM build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cmake gfortran g++ libstdc++-13-dev \
            libopenmpi-dev openmpi-bin libfftw3-dev
      - name: Ensure CHARMM tree
        run: |
          if [[ ! -d setup/charmm/source ]]; then
            tar -xf setup/charmm.tar.xz -C setup
          fi
      - name: Cache libcharmm.so
        id: charmm-cache
        uses: actions/cache@v4
        with:
          path: |
            setup/charmm/libcharmm.so
            setup/charmm/lib
            setup/charmm/.ci-charmm-build-stamp
            ~/.cache/mmml-charmm-build
          # Hash every api/*.F90, not a hand-picked subset: an api_read.F90 fix
          # (sticky READ PARAM APPEND, which zeroed the VDW table) hit a stale
          # cache because that file was not on the list.
          key: charmm-lib-${{ hashFiles('setup/charmm.tar.xz', 'setup/charmm/source/api/*.F90', 'scripts/rebuild_charmm_mlpot.sh') }}
      - name: Build libcharmm.so
        if: steps.charmm-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/setup_charmm_lib.sh
      - name: Write CHARMMSETUP (cache hit)
        if: steps.charmm-cache.outputs.cache-hit == 'true'
        run: |
          {
            echo "export CHARMM_HOME=$PWD/setup/charmm"
            echo "export CHARMM_LIB_DIR=$PWD/setup/charmm"
          } > CHARMMSETUP
      - name: Install package and dependencies
        run: uv sync --extra dev --extra all-cpu --extra charmm-interface
      # Packmol is gitignored and not part of the libcharmm cache, so a cache hit
      # used to skip rebuild_charmm_mlpot.sh and leave the binary missing. Smoke
      # tests that cold-start boxes then fail with FileNotFoundError.
      - name: Build Packmol
        run: bash scripts/rebuild_packmol.sh
      # Every live-CHARMM test is guarded by skipif(not can_import_pycharmm()),
      # and that guard only checks that the .so *file* exists. A library that is
      # present but cannot be dlopen'ed therefore turns this whole 45-minute job
      # into skips that exit 0. Fail here instead, where the cause is obvious.
      - name: PyCHARMM loads
        run: |
          [[ -f CHARMMSETUP ]] && source CHARMMSETUP
          uv run python scripts/ci/assert_pycharmm_live.py
      - name: Run PyCHARMM smoke tests
        run: uv run bash scripts/ci/run_pycharmm_smoke_pytest.sh -q
      # This gate -- not the step above -- is what decides whether the live suite
      # passed. Once libcharmm is loaded, CHARMM's Fortran STOP runs at
      # interpreter teardown and replaces Python's exit status with 0, so a
      # session with failing tests still exits 0 and the script's `|| status=1`
      # never fires. The JUnit reports are the only honest record, and a missing
      # one means the process was killed mid-run (the script fails on that too).
      - name: PyCHARMM smoke suite ran for real
        if: always()
        run: |
          uv run python scripts/ci/check_test_report.py .ci-reports/junit-pycharmm \
            --label "pycharmm smoke" --min-passed 10
