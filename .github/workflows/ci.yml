name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install package and dependencies
        run: uv sync --extra dev --extra all-cpu
      - name: Lint config sanity
        run: |
          uv run python -V
          uv run python -c "import mmml; print('pkg import ok')"
      - name: Run tests
        run: uv run pytest -v --color=yes tests/
      - name: Run CHARMM MPI unit suite
        run: uv run pytest -v --color=yes tests/charmm_mpi/ -m "charmm_mpi and not pycharmm"

  charmm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install "3.13"
      - name: Install CHARMM build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cmake gfortran g++ libstdc++-13-dev \
            libopenmpi-dev openmpi-bin libfftw3-dev
      - name: Ensure CHARMM tree
        run: |
          if [[ ! -d setup/charmm/source ]]; then
            tar -xf setup/charmm.tar.xz -C setup
          fi
      - name: Cache libcharmm.so
        id: charmm-cache
        uses: actions/cache@v4
        with:
          path: |
            setup/charmm/libcharmm.so
            setup/charmm/lib
            setup/charmm/.ci-charmm-build-stamp
            ~/.cache/mmml-charmm-build
          key: charmm-lib-${{ hashFiles('setup/charmm.tar.xz', 'setup/charmm/source/api/api_func.F90', 'setup/charmm/source/api/api_psf.F90', 'setup/charmm/source/api/api_eval.F90', 'setup/charmm/source/api/api_minimize.F90', 'setup/charmm/source/api/api_dynamics.F90', 'setup/charmm/source/api/api_crystal.F90', 'scripts/rebuild_charmm_mlpot.sh') }}
      - name: Build libcharmm.so
        if: steps.charmm-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/setup_charmm_lib.sh
      - name: Write CHARMMSETUP (cache hit)
        if: steps.charmm-cache.outputs.cache-hit == 'true'
        run: |
          {
            echo "export CHARMM_HOME=$PWD/setup/charmm"
            echo "export CHARMM_LIB_DIR=$PWD/setup/charmm"
          } > CHARMMSETUP
      - name: Install package and dependencies
        run: uv sync --extra dev --extra all-cpu --extra charmm-interface
      - name: Run PyCHARMM smoke tests
        run: uv run bash scripts/ci/run_pycharmm_smoke_pytest.sh -q

