name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install package and dependencies
        run: uv sync --extra dev --extra all-cpu
      # Lint and the duplicate-definition scan record their result but do not
      # abort the job: a lint failure used to stop the run before a single test
      # executed, so a bad merge surfaced one problem per push instead of all of
      # them at once. The "Lint gate" step below still fails the job.
      - name: Lint
        id: lint
        continue-on-error: true
        run: make lint
      - name: Duplicate definitions / conflict markers
        id: dupes
        continue-on-error: true
        run: make lint-dupes
      - name: Package import sanity
        if: always()
        run: |
          uv run python -V
          uv run python -c "import mmml; print('package imports ok')"
      - name: Run tests
        if: always()
        run: uv run pytest -v --color=yes --cov=mmml --cov-report=xml tests/
      - name: Run CHARMM MPI unit suite
        if: always()
        run: uv run pytest -v --color=yes tests/charmm_mpi/ -m "charmm_mpi and not pycharmm"
      - name: Lint gate
        if: always()
        run: |
          fail=0
          [ "${{ steps.lint.outcome }}" = "failure" ] && { echo "::error::make lint failed"; fail=1; }
          [ "${{ steps.dupes.outcome }}" = "failure" ] && { echo "::error::make lint-dupes failed (duplicate defs or conflict markers)"; fail=1; }
          exit "$fail"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  charmm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install "3.13"
      - name: Install CHARMM build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cmake gfortran g++ libstdc++-13-dev \
            libopenmpi-dev openmpi-bin libfftw3-dev
      - name: Ensure CHARMM tree
        run: |
          if [[ ! -d setup/charmm/source ]]; then
            tar -xf setup/charmm.tar.xz -C setup
          fi
      - name: Cache libcharmm.so
        id: charmm-cache
        uses: actions/cache@v4
        with:
          path: |
            setup/charmm/libcharmm.so
            setup/charmm/lib
            setup/charmm/.ci-charmm-build-stamp
            ~/.cache/mmml-charmm-build
          key: charmm-lib-${{ hashFiles('setup/charmm.tar.xz', 'setup/charmm/source/api/api_func.F90', 'setup/charmm/source/api/api_psf.F90', 'setup/charmm/source/api/api_eval.F90', 'setup/charmm/source/api/api_minimize.F90', 'setup/charmm/source/api/api_dynamics.F90', 'setup/charmm/source/api/api_crystal.F90', 'scripts/rebuild_charmm_mlpot.sh') }}
      - name: Build libcharmm.so
        if: steps.charmm-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/setup_charmm_lib.sh
      - name: Write CHARMMSETUP (cache hit)
        if: steps.charmm-cache.outputs.cache-hit == 'true'
        run: |
          {
            echo "export CHARMM_HOME=$PWD/setup/charmm"
            echo "export CHARMM_LIB_DIR=$PWD/setup/charmm"
          } > CHARMMSETUP
      - name: Install package and dependencies
        run: uv sync --extra dev --extra all-cpu --extra charmm-interface
      - name: Run PyCHARMM smoke tests
        run: uv run bash scripts/ci/run_pycharmm_smoke_pytest.sh -q
