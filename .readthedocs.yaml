# Read the Docs — MkDocs (matches `make docs-serve` / CI MkDocs HTML)
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

mkdocs:
  configuration: mkdocs.yml
  # Broken cross-page anchors currently emit warnings; keep builds green like
  # local `mkdocs serve` (CI uses `--strict` separately).
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - dev
