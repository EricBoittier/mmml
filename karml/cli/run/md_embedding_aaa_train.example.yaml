# Small PhysNet smoke for aaa.ama peptide (34 atoms).
# Used by: mmml md-embedding train -o artifacts/md_embedding/aaa
data: artifacts/md_embedding/aaa/train.npz
valid_data: artifacts/md_embedding/aaa/valid.npz
ckpt_dir: artifacts/md_embedding/aaa/checkpoints
tag: aaa_smoke
num_atoms: 34
max_atomic_number: 8
features: 32
num_basis_functions: 32
num_iterations: 2
n_res: 1
cutoff: 5.0
batch_size: 16
num_epochs: 30
learning_rate: 0.001
energy_weight: 1.0
forces_weight: 50.0
objective: valid_loss
seed: 42
